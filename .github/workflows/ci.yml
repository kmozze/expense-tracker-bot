name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gradle checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate jOOQ sources
        run: ./gradlew jooqCodegen

      - name: Check Kotlin style
        run: ./gradlew ktlintCheck

      - name: Compile Kotlin
        run: ./gradlew compileKotlin

      - name: Run tests
        run: ./gradlew test

      - name: Add test summary
        if: always()
        run: |
          shopt -s nullglob
          test_reports=(build/test-results/test/*.xml)
          if [ ${#test_reports[@]} -eq 0 ]; then
            echo "## Результаты тестов" >> "$GITHUB_STEP_SUMMARY"
            echo "Ни один junit-отчёт не найден." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=0
          failed=0
          errors=0
          skipped=0

          for report in "${test_reports[@]}"; do
            total=$(( total + $(grep -o '<testcase ' "$report" | wc -l) ))
            failed=$(( failed + $(grep -c '<failure' "$report") ))
            errors=$(( errors + $(grep -c '<error' "$report") ))
            skipped=$(( skipped + $(grep -c '<skipped' "$report") ))
          done

          failed_total=$(( failed + errors ))
          passed=$(( total - failed_total - skipped ))

          {
            echo "## Результаты тестов"
            echo "- Всего: **$total**"
            echo "- Пройдено: **$passed**"
            echo "- Провалено: **$failed_total**"
            echo "- Пропущено: **$skipped**"
            if [ "$failed_total" -gt 0 ]; then
              echo ""
              echo "### Провалившиеся тесты"
              for report in "${test_reports[@]}"; do
                awk '
                  /<testcase / { 
                    if (match($0, /name="([^"]+)"/, a)) {
                      name = a[1]
                    }
                    if (match($0, /classname="([^"]+)"/, b)) {
                      classname = b[1]
                    }
                  }
                  /<failure/ || /<error/ { 
                    if (name != "" && classname != "") {
                      print "- `" classname "#" name "`"
                    }
                  }
                ' "$report"
              done | sort -u
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
