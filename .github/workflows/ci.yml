name: CI
run-name: "${{ github.workflow }} - ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.ref_name }}"

on:
  pull_request: # Run for all PR branches.
  push:
    branches:
      - main # Push checks run only for main.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate jOOQ sources
        run: ./gradlew jooqCodegen

      - name: Check Kotlin style
        run: ./gradlew ktlintCheck

      - name: Compile Kotlin
        run: ./gradlew compileKotlin

      - name: Run tests
        run: ./gradlew test

      - name: Add test summary
        if: always()
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          summary_path = sys.argv[1]
          test_reports = sorted(glob.glob("build/test-results/test/*.xml"))

          total = 0
          failed = 0
          errors = 0
          skipped = 0
          failed_tests = []

          for report in test_reports:
            try:
              root = ET.parse(report).getroot()
            except ET.ParseError:
              continue

            for testcase in root.findall('.//testcase'):
              total += 1
              classname = testcase.attrib.get("classname", "")
              name = testcase.attrib.get("name", "")

              is_skipped = testcase.find('skipped') is not None
              if is_skipped:
                skipped += 1
                continue

              has_failure = testcase.find('failure') is not None
              has_error = testcase.find('error') is not None

              if has_failure:
                failed += 1
              if has_error:
                errors += 1
              if has_failure or has_error:
                if classname and name:
                  failed_tests.append(f"{classname}#{name}")

          failed_total = failed + errors
          passed = total - failed_total - skipped

          with open(summary_path, "a", encoding="utf-8") as summary:
            summary.write("## Результаты тестов\n")

            if not test_reports:
              summary.write("Ни один junit-отчёт не найден.\n")
            else:
              summary.write(f"- Всего: **{total}**\n")
              summary.write(f"- Пройдено: **{passed}**\n")
              summary.write(f"- Провалено: **{failed_total}**\n")
              summary.write(f"- Пропущено: **{skipped}**\n")

              if failed_total > 0:
                summary.write("\n### Провалившиеся тесты\n")
                for test in sorted(set(failed_tests)):
                  summary.write(f"- `{test}`\n")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
